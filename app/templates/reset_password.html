{% extends "base.html" %}
{% block title %}Set a new password{% endblock %}
{% block content %}
<h3>Set a new password</h3>
<form method="post" class="col-md-4">
  <div class="mb-3">
    <label class="form-label">New password</label>
    <input class="form-control" type="password" name="password" required minlength="6">
  </div>
  <div class="mb-3">
    <label class="form-label">Confirm new password</label>
    <input class="form-control" type="password" name="confirm" required minlength="6">
  </div>
  <button class="btn btn-primary">Save new password</button>
  <a class="btn btn-link" href="{{ url_for('auth.login') }}">Back to log in</a>
</form>
{% endblock %}
